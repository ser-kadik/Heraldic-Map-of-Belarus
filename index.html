<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#ffffff" />
  <title>Гербы городов Беларуси</title>
  <script>
    // условие мобильного интерфейса
    window.MOBILE_QUERY = '(max-width: 640px), (pointer: coarse) and (max-width: 1400px)';
    try { document.documentElement.classList.toggle('is-mobile', window.matchMedia(window.MOBILE_QUERY).matches); } catch (e) {}
  </script>
  <link rel="preconnect" href="https://unpkg.com" crossorigin />
  <link rel="preconnect" href="https://a.tile.openstreetmap.org" />
  <link rel="preconnect" href="https://b.tile.openstreetmap.org" />
  <link rel="preconnect" href="https://c.tile.openstreetmap.org" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="map"></div>
  <div id="overlay" class="overlay" role="status" aria-live="polite"></div>
  <div id="legend" class="legend" aria-label="Легенда"></div>

  <div class="panel">
    <div class="panel-head">
      <div class="lang-switch" role="group" aria-label="Язык">
        <button type="button" data-lang="ru" class="active" aria-pressed="true">RU</button>
        <button type="button" data-lang="be" aria-pressed="false">BE</button>
      </div>
      <button id="resetView" class="reset-btn" type="button" aria-label="Сбросить вид" title="Сбросить вид">↺</button>
    </div>

    <div class="search-block">
      <input id="search" type="text" placeholder="Поиск города..." autocomplete="off"
             autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="search"
             aria-label="Поиск города" role="combobox" aria-expanded="false"
             aria-autocomplete="list" aria-controls="suggestions" />
      <button id="searchClear" class="search-clear" type="button" aria-label="Очистить поиск" data-i18n-aria="clearSearch">✕</button>
      <div id="suggestions" class="suggestions" role="listbox" aria-label="Подсказки"></div>
    </div>

    <button id="openFilters" class="filters-btn" type="button" aria-label="Фильтры" data-i18n-aria="filters"
            aria-haspopup="dialog" aria-controls="filters" aria-expanded="false">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
      <span id="filtersBadge" class="filters-badge" hidden></span>
    </button>

    <div class="filters" id="filters" role="group">
      <div class="sheet-head">
        <h2 class="sheet-title" data-i18n="filtersTitle">Что показать на карте</h2>
        <button id="filtersClose" class="sheet-close" type="button" aria-label="Закрыть" data-i18n-aria="close">✕</button>
      </div>
      <label><input type="checkbox" id="toggleBoundaries" checked /> <span data-i18n="boundaries">Показать границы районов</span></label>
      <div class="categories">
        <span data-i18n="categories">Категории:</span>
        <div id="catList"></div>
        <label><input type="checkbox" id="toggleNoInfo" checked /> <span data-i18n="no_info">Без информации о гербе</span></label>
        <div id="legendNote" class="legend-note"></div>
      </div>
      <button id="filtersDone" class="sheet-done" type="button" data-i18n="done">Готово</button>
    </div>
  </div>

  <aside id="citySheet" class="city-sheet" role="dialog" aria-modal="false" aria-hidden="true" aria-labelledby="sheetTitle">
    <div id="sheetTop" class="sheet-top">
      <span class="sheet-grab" aria-hidden="true"><i></i></span>
      <div id="sheetHead" class="card-head"></div>
      <button id="sheetClose" class="sheet-close" type="button" aria-label="Закрыть" data-i18n-aria="close">✕</button>
    </div>
    <div id="sheetBody" class="sheet-body"></div>
  </aside>
  <div id="sheetBackdrop" class="sheet-backdrop"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/@turf/turf@6.5.0/turf.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
